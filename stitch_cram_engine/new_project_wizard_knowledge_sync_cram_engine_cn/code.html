<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>新建项目向导 | Cram Engine</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Source+Serif+4:wght@600;700&amp;family=JetBrains+Mono:wght@450&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="../shared/theme.js"></script>
<style>
    .material-symbols-outlined { font-variation-settings:'FILL'0,'wght'400,'GRAD'0,'opsz'24; display:inline-block; vertical-align:middle; }
    .step-transition { transition:opacity 0.3s ease-in-out, transform 0.3s ease-in-out; }
    .hidden-step { display:none; opacity:0; transform:translateY(10px); }
    .active-step { display:block; opacity:1; transform:translateY(0); }
    ::-webkit-scrollbar { width:8px; }
    ::-webkit-scrollbar-track { background:var(--ce-surface-container-low); }
    ::-webkit-scrollbar-thumb { background:var(--ce-scrollbar-thumb); border-radius:4px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--ce-scrollbar-thumb-hover); }
</style>
</head>
<body class="bg-surface-container-low text-on-background font-body-base min-h-screen flex flex-col overflow-hidden">
<header class="bg-surface-bright flex justify-between items-center w-full px-lg py-sm sticky top-0 z-40 border-b border-outline-variant">
<div class="flex items-center gap-sm"><span class="font-headline-lg text-headline-lg font-bold text-primary">Cram Engine</span></div>
<div class="hidden md:flex items-center gap-lg"><a class="text-on-surface-variant hover:text-primary transition-opacity font-title-md text-title-md" href="#">拆解</a><a class="text-on-surface-variant hover:text-primary transition-opacity font-title-md text-title-md" href="#">教学</a><a class="text-on-surface-variant hover:text-primary transition-opacity font-title-md text-title-md" href="#">测试</a><a class="text-on-surface-variant hover:text-primary transition-opacity font-title-md text-title-md" href="#">修复</a></div>
<div class="flex items-center gap-md"><button class="material-symbols-outlined text-on-surface-variant hover:text-primary">notifications</button><button class="material-symbols-outlined text-on-surface-variant hover:text-primary">account_circle</button></div>
</header>
<main class="flex-grow flex flex-col items-center justify-start py-xl px-gutter overflow-y-auto">
<div class="w-full max-w-3xl mb-xl text-center"><h1 class="font-headline-lg text-headline-lg text-on-surface mb-md">新建项目向导</h1>
<div class="flex items-center justify-between relative mt-lg px-xl"><div class="absolute top-5 left-xl right-xl h-[2px] bg-outline-variant -z-10"></div>
<div class="flex flex-col items-center gap-xs" id="step-node-1"><div class="w-10 h-10 rounded-full flex items-center justify-center bg-primary text-on-primary font-bold shadow-sm transition-all border-2 border-primary">1</div><span class="font-label-caps text-label-caps text-primary">基本信息</span></div>
<div class="flex flex-col items-center gap-xs" id="step-node-2"><div class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-high text-on-surface-variant font-bold shadow-sm transition-all border-2 border-outline-variant">2</div><span class="font-label-caps text-label-caps text-on-surface-variant">课程内容</span></div>
<div class="flex flex-col items-center gap-xs" id="step-node-3"><div class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-high text-on-surface-variant font-bold shadow-sm transition-all border-2 border-outline-variant">3</div><span class="font-label-caps text-label-caps text-on-surface-variant">题目导入</span></div>
</div>
</div>
<div class="w-full max-w-3xl bg-surface-container-lowest rounded-xl border border-outline-variant p-lg shadow-sm">
<section class="active-step step-transition space-y-lg" id="step-content-1">
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="flex flex-col gap-xs"><label class="font-label-caps text-label-caps text-on-surface-variant ml-xs">项目名称</label><input class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all outline-none" placeholder="例如：计算机系统结构 101" type="text"/></div>
<div class="flex flex-col gap-xs"><label class="font-label-caps text-label-caps text-on-surface-variant ml-xs">课程类型</label><select class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all outline-none"><option>STEM 与 工程</option><option>社会科学</option><option>人文科学</option><option>专业认证</option></select></div>
<div class="flex flex-col gap-xs"><label class="font-label-caps text-label-caps text-on-surface-variant ml-xs">考试类型</label><select class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all outline-none"><option>期中 / 期末考试</option><option>以选择题为主</option><option>论述 / 长篇分析</option><option>标准化考试</option></select></div>
<div class="flex flex-col gap-xs"><label class="font-label-caps text-label-caps text-on-surface-variant ml-xs">默认 AI 模型</label><select class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all outline-none"><option>GPT-4o (侧重推理)</option><option>Claude 3.5 Sonnet (侧重语义)</option><option>Local Scholar Llama (侧重隐私)</option></select></div>
</div>
<div class="p-md bg-surface-container-low rounded-lg border border-outline-variant flex items-start gap-md"><span class="material-symbols-outlined text-primary">auto_awesome</span><p class="text-body-sm font-body-sm text-on-surface-variant italic">提示：设置正确的考试类型可以帮助 Cram Engine 为您的学习计划优化大纲提取逻辑。</p></div>
</section>
<section class="hidden-step step-transition space-y-lg" id="step-content-2">
<div class="flex flex-col gap-xs"><label class="font-label-caps text-label-caps text-on-surface-variant ml-xs">上传学习资料</label><div class="border-2 border-dashed border-outline-variant rounded-xl p-xl flex flex-col items-center justify-center bg-surface hover:bg-surface-container-low transition-colors group cursor-pointer"><span class="material-symbols-outlined text-primary text-[48px] mb-sm group-hover:scale-110 transition-transform">cloud_upload</span><p class="text-body-base font-body-base text-on-surface">拖放 PDF、PPT 或 Markdown 文件至此</p><p class="text-body-sm font-body-sm text-on-surface-variant">单个文件最大限制 50MB</p></div></div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg"><div class="flex flex-col gap-xs"><label class="font-label-caps text-label-caps text-on-surface-variant ml-xs">核心知识点</label><textarea class="w-full h-[200px] bg-surface border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all outline-none resize-none font-body-base text-body-base" placeholder="列出基本的原理或公理..."></textarea></div><div class="flex flex-col gap-xs"><label class="font-label-caps text-label-caps text-on-surface-variant ml-xs">重点章节</label><textarea class="w-full h-[200px] bg-surface border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all outline-none resize-none font-body-base text-body-base" placeholder="粘贴教学大纲或章节标题..."></textarea></div></div>
</section>
<section class="hidden-step step-transition space-y-lg" id="step-content-3">
<div class="grid grid-cols-1 gap-lg md:grid-cols-2"><button class="flex flex-col items-center text-center p-lg bg-surface border border-outline-variant rounded-xl hover:border-tertiary hover:bg-tertiary-container/5 transition-all group active:scale-[0.98]"><div class="w-12 h-12 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center justify-center mb-md group-hover:scale-110 transition-transform"><span class="material-symbols-outlined">auto_awesome</span></div><h3 class="font-title-md text-title-md text-on-surface mb-xs">自动生成模拟题</h3><p class="text-body-sm font-body-sm text-on-surface-variant">基于已上传教材与参考资料，由 AI 生成针对性练习</p></button>
<button class="flex flex-col items-center text-center p-lg bg-surface border border-outline-variant rounded-xl hover:border-primary hover:bg-primary/5 transition-all group active:scale-[0.98]"><div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-md group-hover:scale-110 transition-transform"><span class="material-symbols-outlined">content_paste</span></div><h3 class="font-title-md text-title-md text-on-surface mb-xs">粘贴文本</h3><p class="text-body-sm font-body-sm text-on-surface-variant">手动输入题目或题库</p></button>
<button class="flex flex-col items-center text-center p-lg bg-surface border border-outline-variant rounded-xl hover:border-primary hover:bg-primary/5 transition-all group active:scale-[0.98]"><div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mb-md group-hover:scale-110 transition-transform"><span class="material-symbols-outlined">upload_file</span></div><h3 class="font-title-md text-title-md text-on-surface mb-xs">上传文件</h3><p class="text-body-sm font-body-sm text-on-surface-variant">导入 .csv, .xls, 或 .json 题集</p></button>
<button class="flex flex-col items-center text-center p-lg bg-surface border border-outline-variant rounded-xl hover:border-outline hover:bg-surface-container transition-all group active:scale-[0.98]"><div class="w-12 h-12 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center mb-md group-hover:scale-110 transition-transform"><span class="material-symbols-outlined">forward</span></div><h3 class="font-title-md text-title-md text-on-surface mb-xs">稍后处理</h3><p class="text-body-sm font-body-sm text-on-surface-variant">暂时没有题目，让 AI 为我生成</p></button>
</div>
</section>
</div>
</main>
<footer class="bg-surface-container flex flex-col border-t border-outline-variant shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="w-full h-1 bg-outline-variant overflow-hidden"><div class="h-full bg-primary transition-all duration-500 w-[33.33%]" id="wizard-progress"></div></div>
<div class="flex items-center justify-between px-lg py-md h-16 max-w-container-max mx-auto w-full">
<div class="flex gap-md"><button class="invisible px-lg py-sm text-on-surface-variant hover:text-primary transition-all flex items-center gap-xs font-label-caps text-label-caps" id="btn-back"><span class="material-symbols-outlined text-[18px]">arrow_back</span>上一步</button></div>
<div class="flex gap-md"><button class="px-lg py-sm text-on-surface-variant hover:text-primary transition-all font-label-caps text-label-caps">跳过</button><button class="px-xl py-sm bg-primary text-on-primary rounded-lg font-title-md text-title-md shadow-sm hover:brightness-110 active:scale-[0.98] transition-all flex items-center gap-xs" id="btn-next">下一步<span class="material-symbols-outlined text-[18px]">arrow_forward</span></button></div>
</div>
</footer>
<script>
let s=1,m=3,n=document.getElementById('btn-next'),b=document.getElementById('btn-back'),p=document.getElementById('wizard-progress');
function U(){for(let i=1;i<=m;i++){let t=document.getElementById('step-content-'+i),d=document.getElementById('step-node-'+i),c=d.querySelector('div'),l=d.querySelector('span');if(i===s){t.classList.remove('hidden-step');t.classList.add('active-step');c.className="w-10 h-10 rounded-full flex items-center justify-center bg-primary text-on-primary font-bold shadow-sm transition-all border-2 border-primary";l.className="font-label-caps text-label-caps text-primary"}else if(i<s){t.classList.add('hidden-step');t.classList.remove('active-step');c.className="w-10 h-10 rounded-full flex items-center justify-center bg-primary-container text-on-primary-container font-bold shadow-sm transition-all border-2 border-primary";l.className="font-label-caps text-label-caps text-on-surface-variant"}else{t.classList.add('hidden-step');t.classList.remove('active-step');c.className="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-high text-on-surface-variant font-bold shadow-sm transition-all border-2 border-outline-variant";l.className="font-label-caps text-label-caps text-on-surface-variant"}}
b.style.visibility=(s===1)?'hidden':'visible';
if(s===m){n.innerHTML='创建项目 <span class="material-symbols-outlined text-[18px]">rocket_launch</span>';n.classList.replace('bg-primary','bg-tertiary')}else{n.innerHTML='下一步 <span class="material-symbols-outlined text-[18px]">arrow_forward</span>';n.classList.replace('bg-tertiary','bg-primary')}
p.style.width=((s/m)*100)+'%'}
n.addEventListener('click',function(){if(s<m){s++;U()}else{alert('项目初始化中...')}});
b.addEventListener('click',function(){if(s>1){s--;U()}});
</script>
</body></html>
